spring.application.name=virta-back-end
spring.config.import=optional:classpath:application-secrets.properties

# Port: hosting platforms (Render) inject PORT; 8080 locally.
server.port=${PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Health check (GET /actuator/health): API + database status, for uptime monitors.
# Only "health" is exposed, and without details (no internal info leaks).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI: groups in order (their names start with "1.", "2."...).
springdoc.swagger-ui.tags-sorter=alpha

# Google OAuth — public Client ID (the same one used by the frontend).
# Can be overridden by the GOOGLE_CLIENT_ID environment variable.
google.client-id=${GOOGLE_CLIENT_ID:354526557185-r5t7kv2vtsssd3aq5lvnc4ogpb6uvoq0.apps.googleusercontent.com}
