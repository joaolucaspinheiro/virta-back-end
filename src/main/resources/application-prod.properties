# Production profile (Render: SPRING_PROFILES_ACTIVE=prod).

# Structured logs: one JSON object per line (Elastic Common Schema), easy to search and
# filter in log tools, instead of free text.
logging.structured.format.console=ecs

# No SQL in the production logs (noise, and it could expose data).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
