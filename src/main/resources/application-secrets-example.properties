# Copy to application-secrets.properties and fill in your credentials.
# application-secrets.properties is in .gitignore and must never be committed.

spring.datasource.url=jdbc:mysql://localhost:3306/virta_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=YOUR_USERNAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Base64 key to sign the JWTs (minimum 32 bytes / 256 bits)
# To generate: openssl rand -base64 32
api.security.token.secret=YOUR_BASE64_KEY_HERE

# E-mail via Brevo API (HTTPS). Create an API key at app.brevo.com > SMTP & API
# (permission: transactional e-mails) and verify the sender e-mail.
brevo.api-key=YOUR_BREVO_API_KEY
mail.from=YOUR_VERIFIED_SENDER@example.com

# URL do front-end (usada no link do e-mail)
app.frontend-url=http://localhost:5173

# Gemini API (Google AI Studio > Get API key)
gemini.api-key=YOUR_GEMINI_API_KEY
gemini.model=gemini-3.6-flash